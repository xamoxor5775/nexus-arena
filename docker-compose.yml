services:
  nexus-arena:
    build:
      context: .
      args:
        NITRO_PRESET: node-server
    container_name: nexus-arena
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      PGLITE_DATA_DIR: /app/data
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - nexus_pglite_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  nexus_pglite_data:
