# Cache-Control for static files, keyed on the request path. Mirrors
# server/cache-policy.ts (keep both in sync). `map` lives at http level; this
# file is included from nginx.conf's http block via sites-enabled.
#   /assets/*        Vite build output, hashed filenames  -> 1 year, immutable
#   /media/*.json    radio playlist, edited in place        -> always revalidate
#   everything else  public/ files with stable names that   -> 7 days (+1 day SWR)
#                    may be replaced in place
map $uri $nexus_static_cache {
    ~^/assets/          "public, max-age=31536000, immutable";
    ~^/media/.*\.json$  "no-cache";
    default             "public, max-age=604800, stale-while-revalidate=86400";
}

server {
    listen 80;
    listen [::]:80;
    server_name nexusarena.cl www.nexusarena.cl;

    # Static files: nginx serves them from a copy of the container's
    # .output/public (see deploy/sync-static.sh) with sendfile, ETag and native
    # Range support (206) for the demo video/audio. Anything not present in
    # that copy (never synced, or a newer build) falls back to Node, so a
    # missing/partial copy never breaks the site, it only costs performance.
    location ~ ^/(assets|media|textures|models|sfx)/ {
        root /var/www/nexus-arena/public;
        try_files $uri @static_app;
        # No `always`: only 2xx/3xx get the public cache header, never 404s.
        add_header Cache-Control $nexus_static_cache;
        sendfile on;
        tcp_nopush on;
        open_file_cache max=1000 inactive=60s;
    }

    # Fallback for static prefixes: proxied to Node, but with the same cache
    # policy (Node's own header is replaced, never duplicated).
    location @static_app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        add_header Cache-Control $nexus_static_cache;
        # Answer Range requests for proxied files too (Node's static handler
        # only returns full 200s).
        proxy_force_ranges on;
    }

    # HTML documents, /api and everything else: never cached.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }
}
